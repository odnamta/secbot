# ── New targets added 2026-08-31 ─────────────────────────────────────────────

- name: paddle
  platform: yeswehack
  scope_file: scopes/paddle.txt
  profile: stealth
  schedule: weekly
  enabled: true
  notes: |
    UK fintech (merchant-of-record SaaS). Vendor dashboard, login portal,
    REST API, sandbox environment all in scope. $50-$5,000 bounty range.
    Append "BugBounty" to user-agent; self-hosted tools allowed.

- name: dana
  platform: yeswehack
  scope_file: scopes/dana.txt
  profile: stealth
  schedule: weekly
  enabled: true
  notes: |
    Indonesian digital wallet (e-money). Low competition, home advantage.
    Web scope: m.dana.id + mgs.dana.id. €300-€3,000 bounty.
    Manually re-verify ALL findings before submission — live PoC required.

- name: mattermost
  platform: bugcrowd
  scope_file: scopes/mattermost.txt
  profile: stealth
  schedule: weekly
  enabled: true
  notes: |
    Open-source team messaging (Node.js/Go). Moved to Bugcrowd Nov 2024
    with expanded scope (+4 plugin targets). Web UI + WebSocket + GraphQL
    all testable. Full scope: bugcrowd.com/engagements/mattermost-mbb-public

